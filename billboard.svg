<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420">

  <!-- ===================================== -->
  <!-- PREMIUM F1 STYLE TRACKSIDE BILLBOARD  -->
  <!-- Fully Editable SVG Vector Asset       -->
  <!-- Transparent Background                -->
  <!-- ===================================== -->

  <defs>
    <linearGradient id="frameGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4a4a4a"></stop>
      <stop offset="50%" stop-color="#2d2d2d"></stop>
      <stop offset="100%" stop-color="#181818"></stop>
    </linearGradient>

    <linearGradient id="pillarGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#444"></stop>
      <stop offset="50%" stop-color="#222"></stop>
      <stop offset="100%" stop-color="#555"></stop>
    </linearGradient>
  </defs>

  <!-- SUPPORTS -->
  <g id="supports">

    <!-- Left Support -->
    <rect x="180" y="260" width="42" height="140" rx="4" fill="url(#pillarGradient)"></rect>

    <!-- Right Support -->
    <rect x="978" y="260" width="42" height="140" rx="4" fill="url(#pillarGradient)"></rect>

    <!-- Base Plates -->
    <rect x="165" y="390" width="72" height="12" rx="2" fill="#111"></rect>
    <rect x="963" y="390" width="72" height="12" rx="2" fill="#111"></rect>

  </g>

  <!-- FRAME -->
  <g id="frame">

    <!-- Outer Billboard Structure -->
    <rect x="120" y="60" width="960" height="220" rx="10" fill="url(#frameGradient)" stroke="#0d0d0d" stroke-width="8"></rect>

    <!-- Upper Metal Beam -->
    <rect x="120" y="60" width="960" height="18" fill="#111"></rect>

    <!-- Lower Metal Beam -->
    <rect x="120" y="262" width="960" height="18" fill="#111"></rect>

    <!-- Left Metal Side -->
    <rect x="120" y="60" width="18" height="220" fill="#111"></rect>

    <!-- Right Metal Side -->
    <rect x="1062" y="60" width="18" height="220" fill="#111"></rect>

    <!-- Decorative Racing Segments -->
    <rect x="145" y="90" width="30" height="160" fill="#202020"></rect>
    <rect x="1025" y="90" width="30" height="160" fill="#202020"></rect>

  </g>

  <!-- LIGHTING -->
  <g id="lighting">

    <!-- Top Light Bar -->
    <rect x="180" y="42" width="840" height="10" rx="5" fill="#2c2c2c"></rect>

    <!-- Light Modules -->
    <rect x="220" y="35" width="60" height="14" rx="3" fill="#666"></rect>
    <rect x="340" y="35" width="60" height="14" rx="3" fill="#666"></rect>
    <rect x="460" y="35" width="60" height="14" rx="3" fill="#666"></rect>
    <rect x="580" y="35" width="60" height="14" rx="3" fill="#666"></rect>
    <rect x="700" y="35" width="60" height="14" rx="3" fill="#666"></rect>
    <rect x="820" y="35" width="60" height="14" rx="3" fill="#666"></rect>
    <rect x="940" y="35" width="60" height="14" rx="3" fill="#666"></rect>

  </g>

  <!-- SPONSOR PANEL -->
  <g id="sponsor_panel">

    <!--
      INTENTIONALLY EMPTY
      Reserved for dynamic sponsor SVG insertion.
      No text.
      No logo.
      No branding.
    -->

    <rect x="190" y="95" width="820" height="150" rx="6" fill="#000000" stroke="#151515" stroke-width="4"></rect>

  </g>

</svg>